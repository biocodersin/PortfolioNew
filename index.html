<!DOCTYPE html>
<html lang="en" class="no-js">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Vimlesh Rawat | BioCoders</title>
		<meta name="description" content="A page layout concept with a developer/designer theme and a special effect" />
		<meta name="keywords" content="template, page layout, concept, developer, designer, portfolio, effect, animation, css, javascript" />
		<meta name="author" content="Codrops" />
		<link rel="shortcut icon" href="favicon.ico">
		<link href="https://fonts.googleapis.com/css?family=Roboto:400,500|Roboto+Mono" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="css/normalize.css" />
		<link rel="stylesheet" type="text/css" href="css/demo.css" />
		<link rel="stylesheet" type="text/css" href="css/pieces.css" />
		<link rel="stylesheet" type="text/css" href="sponsor/pater.css" />
		<script>document.documentElement.className = 'js';</script>
	</head>
	<body>
		<main>
			<div class="pieces" style="background-image: url(img/normal.png)" data-img-alt="url(img/alt.png)" data-img-code="url(img/code.png)"></div>
			<div class="overlay overlay--hidden"></div>
			<div class="content">
				<div class="content__inner">
					<div class="content__top">
						<h2 class="title">	
							<span class="title__inner mode mode--design" data-switch data-glitch>Vimlesh Rawat</span>
						</h2>
						<div class="controls">
							<a class="codrops-icon codrops-icon--drop" href="https://read.cv/vimleshrawat" target="_blank" title="About">About</a>
							<button class="btn btn--menu mode mode--design" data-switch>
								<!-- <svg class="icon icon--menu"><use xlink:href="#icon-menu"></use></svg> -->
								<!-- <svg class="icon icon--menu-alt"><use xlink:href="#icon-menu-alt"></use></svg> -->
							</button>
						</div>
					</div>
					<div class="menu">
						<ul class="menu__inner">
							<li class="menu__item"><a class="menu__link" data-switch>Portfolio</a></li>
							<!-- <li class="menu__item"><a class="menu__link" data-switch>Case Studies</a></li> -->
						</ul>
					</div>
					<div class="menu menu--code">
						<ul class="menu__inner">
							<li class="menu__item"><a class="menu__link" data-switch>On Coding</a></li>
							<li class="menu__item"><a class="menu__link" data-switch>Experiments</a></li>
							<li class="menu__item"><a class="menu__link" data-switch>Current Projects</a></li>
							<!-- <li class="menu__item"><a class="menu__link" data-switch>Tutorials</a></li> -->
							<li class="menu__item"><a href="www.linkedin.com/in/vimleshrawat" target="_blank" class="menu__link"> Find me on GitHub</a></li>
						</ul>
					</div>
					<div class="content__bottom">
						<div class="switch mode mode--design">
							<a class="switch__item switch__item--current">Designer</a>
							<a class="switch__item"><span class="mode mode--design" data-switch data-glitch>Coder</span></a>
						</div>
						<div class="link-wrap">
							<a class="contact-link mode mode--design" data-switch data-glitch>Work with me</a>
						</div>
					</div>
					<!-- Sponsor -->
					<a class="pater mode mode--design">
						<!-- <img src="sponsor/hired.png" class="pater__img" /> -->
						<h1 class="pater__title" aria-label="Hired">Developer & Dreamer</h1>
						<p class="">I used to be all about coding, but now I'm swapping bits for pixels and loving it more than a code monkey loves bananas!</p>
					</a>
				</div><!-- /content__inner-->
			</div><!-- /content -->
			<div class="loading"></div>
		</main>
		<script src="js/imagesloaded.pkgd.min.js"></script>
		<script src="js/anime.min.js"></script>
		<script src="js/charming.min.js"></script>
		<script src="js/main.js"></script>
	</body>
</html>
